#
# Sample OPC/UA PubSub reference YAML configuration file for Intel TSN NICs.
#
Application:
  ApplicationClockId: CLOCK_TAI
  # ApplicationBaseStartTimeNS: 0
  ApplicationBaseCycleTimeNS: 1000000
  ApplicationTxBaseOffsetNS: 800000
  ApplicationRxBaseOffsetNS: 600000
  ApplicationXdpProgram: xdp_kern_opcua_vid200.o
L2:
  L2Name: OpcUa
  L2Enabled: true
  L2XdpEnabled: false
  L2XdpSkbMode: false
  L2XdpZcMode: true
  L2XdpWakeupMode: false
  L2TxTimeEnabled: true
  L2TxTimeOffsetNS: 100000
  L2Vid: 200
  L2Pcp: 6
  L2EtherType: 0xb62c
  L2NumFramesPerCycle: 8
  L2PayloadPattern: |
    OpcUaPayloadPattern
  L2FrameLength: 128
  L2RxQueue: 7
  L2TxQueue: 7
  L2SocketPriority: 7
  L2TxThreadPriority: 97
  L2RxThreadPriority: 97
  L2TxThreadCpu: 0
  L2RxThreadCpu: 0
  L2Interface: enp0s29f2
  L2Destination: 4e:e4:85:53:c8:78
Log:
  LogThreadPeriodNS: 500000000
  LogThreadPriority: 1
  LogThreadCpu: 1
  LogFile: /var/log/reference_opcua_vid200.log
  LogLevel: Info
Debug:
  DebugStopTraceOnOutlier: false
  DebugStopTraceOnError: false
  DebugMonitorMode: false
  DebugMonitorDestination: 44:44:44:44:44:44
