#
# Sample OPC/UA PubSub mirror YAML configuration file for Intel i226.
#
Application:
  ApplicationClockId: CLOCK_TAI
  ApplicationBaseStartTimeNS: 0
  ApplicationBaseCycleTimeNS: 1000000
  ApplicationTxBaseOffsetNS: 800000
  ApplicationRxBaseOffsetNS: 600000
  ApplicationXdpProgram: xdp_kern_opcua_vid300.o
L2:
  L2Name: OpcUa
  L2Enabled: true
  L2XdpEnabled: true
  L2XdpSkbMode: true
  L2XdpZcMode: true
  L2XdpWakeupMode: true
  L2TxTimeEnabled: false
  L2TxTimeOffsetNS: 0
  L2Vid: 300
  L2Pcp: 4
  L2EtherType: 0xb62c
  L2NumFramesPerCycle: 32
  L2PayloadPattern: |
    OpcUaPayloadPattern
  L2FrameLength: 128
  L2RxQueue: 2
  L2TxQueue: 2
  L2SocketPriority: 5
  L2TxThreadPriority: 98
  L2RxThreadPriority: 98
  L2TxThreadCpu: 2
  L2RxThreadCpu: 2
  L2Interface: enp3s0
  L2Destination: a8:74:1d:9d:36:14
Log:
  LogThreadPeriodNS: 500000000
  LogThreadPriority: 1
  LogThreadCpu: 1
  LogFile: /var/log/mirror_opcua_vid300.log
  LogLevel: Info
Debug:
  DebugStopTraceOnOutlier: false
  DebugStopTraceOnError: false
  DebugMonitorMode: false
  DebugMonitorDestination: 44:44:44:44:44:44
