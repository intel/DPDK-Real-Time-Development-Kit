#
# Sample AVTP mirror YAML configuration file for Intel i226.
#
Application:
  ApplicationClockId: CLOCK_TAI
  ApplicationBaseStartTimeNS: 0
  ApplicationBaseCycleTimeNS: 1000000
  ApplicationTxBaseOffsetNS: 800000
  ApplicationRxBaseOffsetNS: 600000
  ApplicationXdpProgram: xdp_kern_avtp_vid400.o
L2:
  L2Name: Avtp
  L2Enabled: true
  L2XdpEnabled: true
  L2XdpSkbMode: false
  L2XdpZcMode: false
  L2XdpWakeupMode: true
  L2TxTimeEnabled: false
  L2TxTimeOffsetNS: 0
  L2Vid: 400
  L2Pcp: 3
  L2EtherType: 0x22f0
  L2NumFramesPerCycle: 32
  L2PayloadPattern: |
    AvtpPayloadPattern
  L2FrameLength: 128
  L2RxQueue: 3
  L2TxQueue: 3
  L2SocketPriority: 4
  L2TxThreadPriority: 97
  L2RxThreadPriority: 97
  L2TxThreadCpu: 3
  L2RxThreadCpu: 3
  L2Interface: enp3s0
  L2Destination: a8:74:1d:9d:36:14
Log:
  LogThreadPeriodNS: 500000000
  LogThreadPriority: 1
  LogThreadCpu: 1
  LogFile: /var/log/mirror_avtp_vid400.log
  LogLevel: Info
Debug:
  DebugStopTraceOnOutlier: false
  DebugStopTraceOnError: false
  DebugMonitorMode: false
  DebugMonitorDestination: 44:44:44:44:44:44
