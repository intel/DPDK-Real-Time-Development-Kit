apiVersion: 1

datasources:
- name: InfluxDB
  type: influxdb
  access: proxy
  url: http://influxdb:8086
  isDefault: true
  editable: true
  database: rtdk
  jsonData:
    httpMode: GET
    httpHeaderName1: Authorization
  secureJsonData:
    httpHeaderValue1: Token $INFLUXDB_TOKEN
