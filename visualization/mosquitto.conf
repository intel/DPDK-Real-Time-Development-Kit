# Place your local configuration in /etc/mosquitto/conf.d/
#
# A full description of the configuration file is at
# /usr/share/doc/mosquitto/examples/mosquitto.conf.example

persistence false
log_type none
#persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
listener 1883 0.0.0.0
max_queued_messages 500

## Authentication ##
# WARNING: Anonymous access is enabled for local development only.
# For production use:
#   1. Generate a password file:  mosquitto_passwd -c /mosquitto/config/passwd <user>
#   2. Uncomment the lines below and restart the container.
allow_anonymous true
#allow_anonymous false
#password_file /mosquitto/config/passwd

## TLS ##
# To enable TLS, provide certificates and uncomment the block below.
# Mount certs into the container via docker-compose volumes.
#listener 8883 0.0.0.0
#cafile /mosquitto/certs/ca.crt
#certfile /mosquitto/certs/server.crt
#keyfile /mosquitto/certs/server.key
#tls_version tlsv1.2
